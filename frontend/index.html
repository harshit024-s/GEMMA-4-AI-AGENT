<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gemma 4 Agent</title>
  <link rel="stylesheet" href="/static/styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Google+Sans+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
</head>
<body>
  <!-- ─── Sidebar ───────────────────────────────────────────────── -->
  <aside id="sidebar" class="sidebar">
    <div class="sidebar-header">
      <div class="logo">
        <svg class="gemma-icon" viewBox="0 0 32 32" width="28" height="28">
          <circle cx="16" cy="16" r="14" fill="none" stroke="url(#grad)" stroke-width="2.5"/>
          <circle cx="16" cy="10" r="3" fill="#4285F4"/>
          <circle cx="10" cy="20" r="3" fill="#EA4335"/>
          <circle cx="22" cy="20" r="3" fill="#34A853"/>
          <line x1="16" y1="13" x2="10" y2="17" stroke="#FBBC05" stroke-width="1.5"/>
          <line x1="16" y1="13" x2="22" y2="17" stroke="#FBBC05" stroke-width="1.5"/>
          <line x1="10" y1="20" x2="22" y2="20" stroke="#FBBC05" stroke-width="1.5"/>
          <defs>
            <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#4285F4"/>
              <stop offset="33%" stop-color="#EA4335"/>
              <stop offset="66%" stop-color="#FBBC05"/>
              <stop offset="100%" stop-color="#34A853"/>
            </linearGradient>
          </defs>
        </svg>
        <span class="logo-text">Gemma 4 Agent</span>
      </div>
      <button id="new-chat-btn" class="btn-icon" title="New chat">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
    </div>

    <div class="sidebar-section">
      <h3 class="sidebar-title">Available Tools</h3>
      <ul id="tools-list" class="tools-list">
        <li class="tool-item loading-shimmer">&nbsp;</li>
        <li class="tool-item loading-shimmer">&nbsp;</li>
        <li class="tool-item loading-shimmer">&nbsp;</li>
      </ul>
    </div>

    <div class="sidebar-section">
      <h3 class="sidebar-title">Settings</h3>
      <label class="toggle-row">
        <span>Thinking mode</span>
        <input type="checkbox" id="thinking-toggle" />
        <span class="toggle-switch"></span>
      </label>
      <label class="toggle-row">
        <span>Streaming</span>
        <input type="checkbox" id="stream-toggle" checked />
        <span class="toggle-switch"></span>
      </label>
    </div>

    <div class="sidebar-footer">
      <span class="powered-by">Powered by <strong>Google Gemma 4</strong></span>
    </div>
  </aside>

  <!-- ─── Mobile sidebar toggle ─────────────────────────────────── -->
  <button id="sidebar-toggle" class="sidebar-toggle" aria-label="Toggle sidebar">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
  </button>

  <!-- ─── Main chat area ────────────────────────────────────────── -->
  <main class="chat-main">
    <div id="chat-messages" class="chat-messages">
      <!-- Welcome message -->
      <div class="welcome-screen" id="welcome-screen">
        <div class="welcome-icon">
          <svg viewBox="0 0 64 64" width="64" height="64">
            <circle cx="32" cy="32" r="28" fill="none" stroke="url(#wgrad)" stroke-width="3"/>
            <circle cx="32" cy="20" r="5" fill="#4285F4"/>
            <circle cx="20" cy="40" r="5" fill="#EA4335"/>
            <circle cx="44" cy="40" r="5" fill="#34A853"/>
            <line x1="32" y1="25" x2="20" y2="35" stroke="#FBBC05" stroke-width="2"/>
            <line x1="32" y1="25" x2="44" y2="35" stroke="#FBBC05" stroke-width="2"/>
            <line x1="20" y1="40" x2="44" y2="40" stroke="#FBBC05" stroke-width="2"/>
            <defs>
              <linearGradient id="wgrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#4285F4"/>
                <stop offset="33%" stop-color="#EA4335"/>
                <stop offset="66%" stop-color="#FBBC05"/>
                <stop offset="100%" stop-color="#34A853"/>
              </linearGradient>
            </defs>
          </svg>
        </div>
        <h1 class="welcome-title">Hello! I'm <span class="gradient-text">Gemma Agent</span></h1>
        <p class="welcome-sub">Powered by Google's Gemma 4 model with tool-calling capabilities.</p>
        <div class="welcome-chips">
          <button class="chip" data-prompt="What's the weather like in Tokyo right now?">🌤️ Weather in Tokyo</button>
          <button class="chip" data-prompt="Calculate the compound interest on $10,000 at 5% for 10 years">🧮 Compound Interest</button>
          <button class="chip" data-prompt="Search the web for the latest AI news">🔍 Latest AI News</button>
          <button class="chip" data-prompt="Generate a Python function that implements binary search">💻 Generate Code</button>
        </div>
      </div>
    </div>

    <!-- ─── Input area ─────────────────────────────────────────── -->
    <div class="input-area">
      <div class="input-container">
        <textarea
          id="message-input"
          placeholder="Message Gemma Agent…"
          rows="1"
          autofocus
        ></textarea>
        <button id="send-btn" class="send-btn" disabled title="Send message (Enter)">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </div>
      <p class="input-hint">Gemma 4 can make mistakes. Verify important information.</p>
    </div>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
